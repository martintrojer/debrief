[package]
name = "debrief"
description = "Catch up with what the agents committed, and answer back"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "debrief"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.8.7"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
debrief-review = { path = "../debrief-review", version = "0.1.0" }
dirs = "7.0.0"
notify = "8"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
