name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux and jj for the end-to-end tests
        run: |
          sudo apt-get update && sudo apt-get install -y tmux
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.46.0/jj-v0.46.0-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version
      - name: Identity for test commits
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: bash scripts/check.sh
