[workspace]
resolver = "3"
members = ["crates/debrief-review", "crates/debrief"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Martin Trojer <martin.trojer@gmail.com>"]
repository = "https://github.com/martintrojer/debrief"
version = "0.6.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
